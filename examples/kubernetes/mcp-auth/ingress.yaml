# Two separate Ingress resources are required: nginx.ingress.kubernetes.io/rewrite-target
# applies to every path declared in the Ingress it's set on, not just the path it's
# "meant for" - combining both paths in one Ingress would also rewrite /mcp.
---
# Well-known document: rewritten to the plain RESOURCE_METADATA_PATH
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: demo-wellknown
  namespace: demo
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # Rewrites the path-suffixed well-known URL back to the plain
    # RESOURCE_METADATA_PATH that rest-rego itself listens on.
    nginx.ingress.kubernetes.io/rewrite-target: /.well-known/oauth-protected-resource
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.example.com
      secretName: demo-tls
  rules:
    - host: api.example.com
      http:
        paths:
          # RFC 9728 well-known document, path-suffixed to match RESOURCE_URL=.../mcp
          - path: /.well-known/oauth-protected-resource/mcp
            pathType: Exact
            backend:
              service:
                name: demo
                port:
                  number: 80
---
# Protected resource and everything else: no rewrite annotation
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: demo
  namespace: demo
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.example.com
      secretName: demo-tls
  rules:
    - host: api.example.com
      http:
        paths:
          # The actual protected resource path - routed unchanged, no rewrite
          - path: /mcp
            pathType: Prefix
            backend:
              service:
                name: demo
                port:
                  number: 80
